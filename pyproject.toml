[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate-agent"
version = "0.1.0"
description = "LifeMate agent, data preparation and evaluation tools"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["lifemate", "lifemate.*", "training", "evaluation"]

[project.scripts]
lifemate = "lifemate.cli:main"
